<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <!-- Dojo Floor — Tatami-inspired grid with green highlights -->
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#1A3A2A"/>
    </linearGradient>
    <pattern id="tatami" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="none"/>
      <rect x="0" y="0" width="100" height="200" fill="none" stroke="#2D6A4F" stroke-width="0.5" opacity="0.08"/>
      <rect x="100" y="0" width="100" height="100" fill="none" stroke="#2D6A4F" stroke-width="0.5" opacity="0.06"/>
      <rect x="100" y="100" width="100" height="100" fill="none" stroke="#2D6A4F" stroke-width="0.5" opacity="0.06"/>
      <!-- Tatami weave texture -->
      <line x1="0" y1="50" x2="100" y2="50" stroke="#52B788" stroke-width="0.2" opacity="0.04"/>
      <line x1="0" y1="150" x2="100" y2="150" stroke="#52B788" stroke-width="0.2" opacity="0.04"/>
      <line x1="150" y1="0" x2="150" y2="100" stroke="#52B788" stroke-width="0.2" opacity="0.04"/>
      <line x1="150" y1="100" x2="150" y2="200" stroke="#52B788" stroke-width="0.2" opacity="0.04"/>
    </pattern>
    <radialGradient id="centerLight" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#2D6A4F" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#bg3)"/>
  <rect width="3840" height="2160" fill="url(#tatami)"/>
  <rect width="3840" height="2160" fill="url(#centerLight)"/>

  <!-- Subtle floor glow line -->
  <line x1="0" y1="1620" x2="3840" y2="1620" stroke="#52B788" stroke-width="0.5" opacity="0.06"/>

  <!-- Vignette -->
  <radialGradient id="vig3" cx="50%" cy="50%" r="65%">
    <stop offset="0%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
  </radialGradient>
  <rect width="3840" height="2160" fill="url(#vig3)"/>
</svg>
