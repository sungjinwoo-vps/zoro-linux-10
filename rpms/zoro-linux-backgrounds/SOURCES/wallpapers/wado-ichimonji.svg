<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <!-- Wado Ichimonji — Elegant white-green with flowing curves -->
  <defs>
    <linearGradient id="bgW" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#162B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#bgW)"/>

  <!-- Elegant flowing curve — like Wado's blade curvature -->
  <path d="M0,1400 Q960,600 1920,1080 T3840,700" fill="none" stroke="#F5F5F0" stroke-width="1.5" opacity="0.06"/>
  <path d="M0,1400 Q960,600 1920,1080 T3840,700" fill="none" stroke="#F5F5F0" stroke-width="8" opacity="0.02" filter="url(#softGlow)"/>

  <!-- Secondary curve -->
  <path d="M0,1500 Q960,700 1920,1180 T3840,800" fill="none" stroke="#52B788" stroke-width="0.5" opacity="0.08"/>

  <!-- Circle motif (tsuba) -->
  <circle cx="1920" cy="1080" r="200" fill="none" stroke="#F5F5F0" stroke-width="0.5" opacity="0.03"/>
  <circle cx="1920" cy="1080" r="100" fill="none" stroke="#52B788" stroke-width="0.3" opacity="0.05"/>

  <radialGradient id="vigW" cx="50%" cy="50%" r="65%">
    <stop offset="0%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
  </radialGradient>
  <rect width="3840" height="2160" fill="url(#vigW)"/>
</svg>
