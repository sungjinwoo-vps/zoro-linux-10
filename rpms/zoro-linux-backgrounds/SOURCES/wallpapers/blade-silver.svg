<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <!-- Blade Silver — Minimalist silver gradient with subtle texture -->
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1D23"/>
      <stop offset="50%" stop-color="#2A2D35"/>
      <stop offset="100%" stop-color="#1A1D23"/>
    </linearGradient>
    <!-- Brushed metal texture -->
    <pattern id="brushed" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <line x1="0" y1="2" x2="4" y2="2" stroke="#A8B5C8" stroke-width="0.15" opacity="0.06"/>
    </pattern>
    <linearGradient id="silverShine" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#A8B5C8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#A8B5C8" stop-opacity="0.03"/>
      <stop offset="50%" stop-color="#F5F5F0" stop-opacity="0.05"/>
      <stop offset="70%" stop-color="#A8B5C8" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#A8B5C8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#bg5)"/>
  <rect width="3840" height="2160" fill="url(#brushed)"/>
  <rect width="3840" height="2160" fill="url(#silverShine)"/>

  <!-- Single diagonal line — blade edge -->
  <line x1="0" y1="2160" x2="3840" y2="0" stroke="#A8B5C8" stroke-width="0.5" opacity="0.08"/>

  <!-- Accent dot -->
  <circle cx="1920" cy="1080" r="3" fill="#52B788" opacity="0.15"/>
</svg>
