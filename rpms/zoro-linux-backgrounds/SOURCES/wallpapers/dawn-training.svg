<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <!-- Dawn Training — Warm gradient sunrise over dark forest -->
  <defs>
    <linearGradient id="bgD" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="40%" stop-color="#1A3A2A"/>
      <stop offset="70%" stop-color="#2D6A4F"/>
      <stop offset="85%" stop-color="#8B6914" stop-opacity="0.3"/>
      <stop offset="95%" stop-color="#C9A84C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F0EAD6" stop-opacity="0.05"/>
    </linearGradient>
    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="50%" cy="10%" r="30%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#bgD)"/>
  <rect width="3840" height="2160" fill="url(#sunGlow)"/>

  <!-- Horizon line -->
  <line x1="0" y1="540" x2="3840" y2="540" stroke="#C9A84C" stroke-width="0.5" opacity="0.08"/>

  <!-- Mountain/forest silhouette shapes -->
  <polygon points="0,800 300,600 600,700 900,550 1200,650 1500,500 1800,620 2100,480 2400,580 2700,520 3000,600 3300,500 3600,620 3840,550 3840,800 0,800"
           fill="#1A3A2A" opacity="0.2"/>
  <polygon points="0,900 400,700 800,800 1200,680 1600,770 2000,650 2400,730 2800,680 3200,750 3600,700 3840,780 3840,900 0,900"
           fill="#0D1117" opacity="0.3"/>

  <radialGradient id="vigD" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
  </radialGradient>
  <rect width="3840" height="2160" fill="url(#vigD)"/>
</svg>
