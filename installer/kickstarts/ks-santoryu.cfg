# ═══════════════════════════════════════════════════════════════
# Zoro Linux 10 — Kickstart: Santoryu Full (Dojo Edition)
# ═══════════════════════════════════════════════════════════════
# Everything: GNOME + KDE + all Zoro themes, extras, and tools.
# "Three swords, all at once."
# ═══════════════════════════════════════════════════════════════

graphical
lang en_US.UTF-8
keyboard us
timezone UTC --utc
rootpw --lock
firstboot --enable
eula --agreed
reboot

network --bootproto=dhcp --activate --hostname=zorolinux-dojo.localdomain
zerombr
clearpart --all --initlabel
part /boot --fstype=xfs --size=1024
part /boot/efi --fstype=efi --size=512
part pv.01 --size=1 --grow
volgroup zorovg pv.01
logvol / --fstype=xfs --vgname=zorovg --name=root --size=81920
logvol /home --fstype=xfs --vgname=zorovg --name=home --size=1 --grow
logvol swap --vgname=zorovg --name=swap --size=8192
bootloader --append="rhgb quiet" --location=mbr
firewall --enabled --service=ssh
selinux --enforcing

%packages
@^workstation-product-environment
@gnome-desktop
@kde-desktop-environment
@development-tools
@rpm-development-tools
@virtualization
# All Zoro branding
zoro-linux-release
zoro-linux-logos
zoro-linux-backgrounds
zoro-linux-themes
zoro-linux-icon-theme
zoro-linux-cursor-theme
zoro-linux-grub2-theme
zoro-linux-plymouth
zoro-linux-kde-theme
zoro-linux-welcome
zoro-linux-cockpit-branding
zoro-linux-security-hardening
zoro-fetch
# Desktop apps
gnome-tweaks
gnome-extensions-app
firefox
libreoffice
gimp
inkscape
blender
# Dev tools
vim-enhanced
git
gcc
gcc-c++
make
cmake
python3
python3-pip
nodejs
golang
rust
cargo
# Containers
podman
buildah
skopeo
# System
cockpit
flatpak
%end

%post --log=/root/ks-post.log
#!/bin/bash

echo "⚔  Zoro Linux 10 — Santoryu Full (Dojo Edition) — Post-Install"

# Apply all themes
mkdir -p /etc/dconf/db/local.d
cat > /etc/dconf/db/local.d/01-zoro-theme << 'DCONF'
[org/gnome/desktop/interface]
gtk-theme='ZoroDark'
icon-theme='ZoroIcons'
cursor-theme='ZoroBlade'
font-name='Inter 11'
monospace-font-name='JetBrains Mono 10'
color-scheme='prefer-dark'

[org/gnome/desktop/background]
picture-uri='file:///usr/share/backgrounds/zorolinux/the-vow.png'
picture-uri-dark='file:///usr/share/backgrounds/zorolinux/the-vow.png'
DCONF
dconf update

# Set Plymouth and GRUB themes
plymouth-set-default-theme zorolinux 2>/dev/null
grub2-mkconfig -o /boot/grub2/grub.cfg 2>/dev/null

# Enable Cockpit
systemctl enable --now cockpit.socket

# Enable Flathub
flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo 2>/dev/null

# Apply hardening
/usr/sbin/zoro-harden --profile=zoro-default 2>/dev/null

# Welcome app on first login
mkdir -p /etc/skel/.config/autostart
cp /usr/share/applications/zoro-welcome.desktop /etc/skel/.config/autostart/ 2>/dev/null

echo "⚔  Santoryu — all three blades drawn. Dojo Edition complete."
%end
