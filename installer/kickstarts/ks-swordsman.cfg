# ═══════════════════════════════════════════════════════════════
# Zoro Linux 10 — Kickstart: The Swordsman (Workstation)
# ═══════════════════════════════════════════════════════════════
# Full desktop with GNOME (ZoroDeck), developer tools, and themes.
# ═══════════════════════════════════════════════════════════════

graphical
lang en_US.UTF-8
keyboard us
timezone UTC --utc
rootpw --lock
firstboot --enable
eula --agreed
reboot

network --bootproto=dhcp --activate --hostname=zorolinux-workstation.localdomain
zerombr
clearpart --all --initlabel
part /boot --fstype=xfs --size=1024
part /boot/efi --fstype=efi --size=512
part pv.01 --size=1 --grow
volgroup zorovg pv.01
logvol / --fstype=xfs --vgname=zorovg --name=root --size=51200
logvol /home --fstype=xfs --vgname=zorovg --name=home --size=1 --grow
logvol swap --vgname=zorovg --name=swap --size=4096
bootloader --append="rhgb quiet" --location=mbr
firewall --enabled --service=ssh
selinux --enforcing
services --enabled=sshd,auditd,firewalld,chronyd,gdm

%packages
@^workstation-product-environment
@gnome-desktop
@development-tools
@rpm-development-tools
zoro-linux-release
zoro-linux-logos
zoro-linux-backgrounds
zoro-linux-themes
zoro-linux-icon-theme
zoro-linux-cursor-theme
zoro-linux-grub2-theme
zoro-linux-plymouth
zoro-linux-welcome
zoro-linux-security-hardening
zoro-fetch
gnome-tweaks
gnome-extensions-app
gnome-terminal
nautilus
firefox
vim-enhanced
git
gcc
gcc-c++
make
cmake
python3
python3-pip
nodejs
podman
buildah
skopeo
flatpak
%end

%post --log=/root/ks-post.log
#!/bin/bash

echo "⚔  Zoro Linux 10 — The Swordsman (Workstation) — Post-Install"

# Apply ZoroDark theme for all users
mkdir -p /etc/dconf/db/local.d
cat > /etc/dconf/db/local.d/01-zoro-theme << 'DCONF'
[org/gnome/desktop/interface]
gtk-theme='ZoroDark'
icon-theme='ZoroIcons'
cursor-theme='ZoroBlade'
font-name='Inter 11'
document-font-name='Inter 11'
monospace-font-name='JetBrains Mono 10'
color-scheme='prefer-dark'

[org/gnome/desktop/wm/preferences]
titlebar-font='Inter Bold 11'
theme='ZoroDark'

[org/gnome/desktop/background]
picture-uri='file:///usr/share/backgrounds/zorolinux/the-vow.png'
picture-uri-dark='file:///usr/share/backgrounds/zorolinux/the-vow.png'
picture-options='zoom'

[org/gnome/desktop/screensaver]
picture-uri='file:///usr/share/backgrounds/zorolinux/santoryu-flow.png'

[org/gnome/shell]
favorite-apps=['firefox.desktop', 'org.gnome.Nautilus.desktop', 'org.gnome.Terminal.desktop', 'org.gnome.TextEditor.desktop', 'org.gnome.Software.desktop']
DCONF

dconf update

# Set Plymouth theme
plymouth-set-default-theme zorolinux 2>/dev/null

# Apply GRUB theme
if [ -f /boot/grub2/themes/zorolinux/theme.txt ]; then
    grub2-mkconfig -o /boot/grub2/grub.cfg 2>/dev/null
fi

# Set firewall zone to home (workstation default)
firewall-cmd --set-default-zone=home --permanent
firewall-cmd --reload

# Enable Flathub
flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo 2>/dev/null

# Apply hardening
if [ -x /usr/sbin/zoro-harden ]; then
    /usr/sbin/zoro-harden --profile=zoro-default
fi

echo "⚔  The Swordsman is ready. Workstation install complete."
%end
