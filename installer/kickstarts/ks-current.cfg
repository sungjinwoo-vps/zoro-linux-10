# ═══════════════════════════════════════════════════════════════
# Zoro Linux 10 — Kickstart: The Current (Container Host)
# ═══════════════════════════════════════════════════════════════
# Container-optimised: Podman, crun, CNI, minimal surface area.
# ═══════════════════════════════════════════════════════════════

text
lang en_US.UTF-8
keyboard us
timezone UTC --utc
rootpw --lock
firstboot --disable
eula --agreed
reboot

network --bootproto=dhcp --activate --hostname=zorolinux-container.localdomain
zerombr
clearpart --all --initlabel
autopart --type=lvm --fstype=xfs
bootloader --append="rhgb quiet" --location=mbr
firewall --enabled --service=ssh
selinux --enforcing
services --enabled=sshd,auditd,firewalld,chronyd

%packages --instLangs=en
@^minimal-environment
zoro-linux-release
zoro-linux-security-hardening
zoro-fetch
podman
buildah
skopeo
crun
containernetworking-plugins
slirp4netns
fuse-overlayfs
cockpit
cockpit-podman
bash-completion
vim-enhanced
tmux
git
curl
jq
%end

%post --log=/root/ks-post.log
#!/bin/bash

echo "⚔  Zoro Linux 10 — The Current (Container Host) — Post-Install"

# Configure container storage for overlay
cat > /etc/containers/storage.conf << 'STOREOF'
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"
[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
STOREOF

# Enable rootless containers
echo "user.max_user_namespaces=28633" >> /etc/sysctl.d/99-zoro-containers.conf
sysctl --system

# Enable Cockpit for container management
systemctl enable --now cockpit.socket

# Apply hardening
/usr/sbin/zoro-harden --profile=zoro-default 2>/dev/null

# Pre-pull Zoro Linux container base image
# podman pull quay.io/zorolinux/zorolinux:10

echo "⚔  The Current flows. Container host ready."
%end
