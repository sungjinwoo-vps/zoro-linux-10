# ═══════════════════════════════════════════════════════════════
# Zoro Linux 10 — Kickstart: The Strategist (Server)
# ═══════════════════════════════════════════════════════════════
# Headless server with sshd, Cockpit, and server management tools.
# ═══════════════════════════════════════════════════════════════

text
lang en_US.UTF-8
keyboard us
timezone UTC --utc
rootpw --lock
firstboot --disable
eula --agreed
reboot

network --bootproto=dhcp --activate --hostname=zorolinux-server.localdomain
zerombr
clearpart --all --initlabel
autopart --type=lvm --fstype=xfs
bootloader --append="rhgb quiet" --location=mbr
firewall --enabled --service=ssh,cockpit
selinux --enforcing
services --enabled=sshd,auditd,firewalld,chronyd,cockpit.socket

%packages --instLangs=en
@^server-product-environment
zoro-linux-release
zoro-linux-security-hardening
zoro-linux-cockpit-branding
zoro-fetch
bash-completion
vim-enhanced
tmux
screen
curl
wget
rsync
git
cockpit
cockpit-storaged
cockpit-networkmanager
cockpit-packagekit
cockpit-selinux
tuned
firewalld
chrony
audit
policycoreutils-python-utils
setroubleshoot-server
dnf-automatic
%end

%post --log=/root/ks-post.log
#!/bin/bash

echo "⚔  Zoro Linux 10 — The Strategist (Server) — Post-Install"

# Apply hardening
if [ -x /usr/sbin/zoro-harden ]; then
    /usr/sbin/zoro-harden --profile=zoro-default
fi

# Enable Cockpit
systemctl enable --now cockpit.socket

# Set firewall zone to public (server default)
firewall-cmd --set-default-zone=public --permanent
firewall-cmd --reload

# Enable automatic updates (security only)
sed -i 's/apply_updates = no/apply_updates = yes/' /etc/dnf/automatic.conf 2>/dev/null
sed -i 's/upgrade_type = default/upgrade_type = security/' /etc/dnf/automatic.conf 2>/dev/null
systemctl enable --now dnf-automatic-install.timer

# Tune for server workload
tuned-adm profile throughput-performance 2>/dev/null

echo "⚔  The Strategist stands ready. Server install complete."
%end
