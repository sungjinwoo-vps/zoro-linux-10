# ═══════════════════════════════════════════════════════════════
# Zoro Linux 10 — Kickstart: The Blade (Minimal Install)
# ═══════════════════════════════════════════════════════════════
# "If I die here, then I'm a man that could only make it this far."
# Bare OS, CLI only, no GUI. Server-ready minimal footprint.
# ═══════════════════════════════════════════════════════════════

# ── System Configuration ─────────────────────────────────────
text
lang en_US.UTF-8
keyboard us
timezone UTC --utc
rootpw --lock
firstboot --disable
eula --agreed
reboot

# ── Network ──────────────────────────────────────────────────
network --bootproto=dhcp --activate --hostname=zorolinux.localdomain

# ── Disk Partitioning ───────────────────────────────────────
zerombr
clearpart --all --initlabel
autopart --type=lvm --fstype=xfs

# ── Bootloader ───────────────────────────────────────────────
bootloader --append="rhgb quiet" --location=mbr

# ── Firewall & SELinux ───────────────────────────────────────
firewall --enabled --service=ssh
selinux --enforcing

# ── Services ─────────────────────────────────────────────────
services --enabled=sshd,auditd,firewalld,chronyd

# ── Package Selection ───────────────────────────────────────
%packages --instLangs=en
@^minimal-environment
zoro-linux-release
zoro-linux-security-hardening
bash-completion
vim-enhanced
tmux
curl
wget
rsync
tar
gzip
xz
bzip2
bind-utils
iproute
iputils
net-tools
openssh-server
openssh-clients
sudo
chrony
audit
-iwl*
-ivtv-firmware
-plymouth
%end

# ── Post-Installation ───────────────────────────────────────
%post --log=/root/ks-post.log
#!/bin/bash

echo "⚔  Zoro Linux 10 — The Blade (Minimal) — Post-Install"

# Apply security hardening
if [ -x /usr/sbin/zoro-harden ]; then
    /usr/sbin/zoro-harden --profile=zoro-default
fi

# Set up zoro-fetch on login
if [ -f /etc/profile.d/zoro-fetch.sh ]; then
    chmod +x /etc/profile.d/zoro-fetch.sh
fi

# Create admin user (to be customised)
# useradd -G wheel zoro
# echo "zoro:changeme" | chpasswd

# Disable root login via SSH
echo "PermitRootLogin no" >> /etc/ssh/sshd_config.d/99-zoro.conf

# Set default editor
echo "export EDITOR=vim" >> /etc/profile.d/zoro-defaults.sh

echo "⚔  The Blade is forged. Minimal install complete."
%end
