# ═══════════════════════════════════════════════════════════════
# Zoro Linux 10 — Pungi Compose Configuration
# ═══════════════════════════════════════════════════════════════
# Used by pungi-koji to compose the OS tree for ISO creation.
# ═══════════════════════════════════════════════════════════════

release_name = "Zoro Linux"
release_short = "ZoroLinux"
release_version = "10"
release_type = "ga"
release_is_layered = False

# ── Compose Settings ─────────────────────────────────────────
compose_type = "production"
old_composes_per_release_type = False

# ── Variants ─────────────────────────────────────────────────
variants_file = "variants.xml"
comps_file = {
    "scm": "file",
    "file": "comps-zorolinux-10.xml",
}

# ── Signing ──────────────────────────────────────────────────
sigkeys = [""]  # Add GPG key ID when available

# ── Packages ─────────────────────────────────────────────────
filter_system_release_packages = False

# ── Gather Options ───────────────────────────────────────────
gather_method = {
    "^.*$": {
        "comps": "deps",
        "module": "nodeps",
    }
}

gather_backend = "dnf"
gather_profiler = False
gather_allow_reuse = False
check_deps = False

greedy_method = "build"

# ── Repositories (source repos for compose) ──────────────────
pkgset_source = "repos"

pkgset_repos = {
    "x86_64": [
        "zoro-baseos-x86_64",
        "zoro-appstream-x86_64",
    ],
    "aarch64": [
        "zoro-baseos-aarch64",
        "zoro-appstream-aarch64",
    ],
}

# ── Repository Definitions ──────────────────────────────────
[zoro-baseos-x86_64]
name = Zoro Linux 10 - BaseOS x86_64
baseurl = file:///srv/zoro-compose/10/BaseOS/x86_64/os/

[zoro-appstream-x86_64]
name = Zoro Linux 10 - AppStream x86_64
baseurl = file:///srv/zoro-compose/10/AppStream/x86_64/os/

[zoro-baseos-aarch64]
name = Zoro Linux 10 - BaseOS aarch64
baseurl = file:///srv/zoro-compose/10/BaseOS/aarch64/os/

[zoro-appstream-aarch64]
name = Zoro Linux 10 - AppStream aarch64
baseurl = file:///srv/zoro-compose/10/AppStream/aarch64/os/

# ── createrepo Options ───────────────────────────────────────
createrepo_checksum = "sha256"
createrepo_c = True

# ── ISO Configuration ───────────────────────────────────────
iso_basename = "ZoroLinux"
iso_version = "10.0"

createiso_skip = [
    ('^Extras$', {'*': True}),
    ('^CRB$', {'*': True}),
]

# ── Buildinstall (Lorax) ────────────────────────────────────
buildinstall_method = "lorax"
buildinstall_kickstart = None

lorax_options = [
    ('^.*$', {
        '*': {
            'product': 'Zoro Linux',
            'version': '10',
            'release': '10.0',
            'isfinal': True,
            'volid': 'ZORO_LINUX_10',
            'variant': 'Santoryu',
            'bugurl': 'https://bugs.zorolinux.org',
            'nomacboot': True,
        }
    })
]

# ── Image Build (optional cloud images) ─────────────────────
image_build = {}

# ── Extra ISOs ───────────────────────────────────────────────
extra_isos = {}

# ── Live Images ──────────────────────────────────────────────
live_images = {}

# ── Ostree (if needed for atomic/immutable) ──────────────────
ostree = {}
