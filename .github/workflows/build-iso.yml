# ═══════════════════════════════════════════════════════════════
# Zoro Linux 10 — ISO Build Pipeline (GitHub Actions)
# ═══════════════════════════════════════════════════════════════
# Builds RPMs, composes repos, and assembles bootable ISOs.
# Runs on: push to dev branch, or manual trigger.
# ═══════════════════════════════════════════════════════════════

name: "⚔️ Zoro Linux ISO Build"

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      variant:
        description: "ISO variant to build"
        required: false
        default: "all-editions"
        type: choice
        options:
          - all-editions
          - Blade
          - Strategist
          - Swordsman
          - Santoryu
          - Current
          - dvd
          - minimal
          - netinstall
          - all
          - everything

env:
  ZORO_VERSION: "10"
  ZORO_RELEASE: "10.0"
  ZORO_CODENAME: "Santoryu"
  BUILD_ROOT: "/srv/zoro-build"
  COMPOSE_ROOT: "/srv/zoro-compose/10"
  REPO_ROOT: "/srv/zoro-repos/10"
  ISO_ROOT: "/srv/zoro-isos/10"

# Force bash for every run step. The minimal CentOS Stream 10 container makes
# GitHub fall back to "sh -e", which disables brace expansion (e.g.
# mkdir {a,b}) and other bashisms the pipeline relies on.
defaults:
  run:
    shell: bash

jobs:
  # ── Stage 0: Lint & Validate ──────────────────────────────────
  validate:
    name: "🔍 Validate Sources"
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          dnf install -y rpmlint ShellCheck xmllint 2>/dev/null || \
          dnf install -y rpmlint ShellCheck libxml2 2>/dev/null || true

      - name: Lint RPM spec files
        run: |
          echo "⚔ Linting spec files..."
          find rpms/ -name "*.spec" -exec rpmlint {} \; || true

      - name: ShellCheck scripts
        run: |
          echo "⚔ Checking shell scripts..."
          find antigravity/ -name "*.sh" -exec shellcheck -s bash {} \; || true

      - name: Check for upstream branding leaks
        run: |
          echo "⚔ Scanning for upstream branding leaks..."
          LEAKS=0
          for pattern in "CentOS Stream" "Red Hat Enterprise" "RHEL" "Rocky Linux" "AlmaLinux"; do
            if grep -r --include="*.spec" --include="*.cfg" --include="*.conf" \
               -l "$pattern" rpms/ installer/ compose/ 2>/dev/null | grep -v "stage1\|antigravity.conf\|upstream"; then
              echo "  ⚠ Found '$pattern' leak in source files"
              LEAKS=$((LEAKS + 1))
            fi
          done
          if [ "$LEAKS" -gt 0 ]; then
            echo "::warning::Found $LEAKS potential branding leaks"
          else
            echo "  ✓ No branding leaks detected"
          fi

      - name: Validate kickstart syntax
        run: |
          echo "⚔ Validating kickstart files..."
          for ks in installer/kickstarts/*.cfg; do
            if head -1 "$ks" | grep -q "^#"; then
              echo "  ✓ $ks — valid header"
            else
              echo "  ⚠ $ks — missing header comment"
            fi
          done

  # ── Stage 1: Build RPMs ────────────────────────────────────────
  build-rpms:
    name: "📦 Build RPMs"
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          echo "⚔ Setting up build environment..."
          # Enable CRB (CodeReady Builder) for -devel packages
          dnf install -y dnf-plugins-core 2>&1 | tail -3 || true
          dnf config-manager --set-enabled crb 2>&1 | tail -3 || true

          # Enable EPEL for inkscape, ImageMagick, etc.
          dnf install -y epel-release 2>&1 | tail -3 || \
          dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm 2>&1 | tail -3 || true

          # Core build tools — must succeed (install separately so a missing
          # optional dep can't abort the whole transaction)
          dnf install -y rpm-build rpmdevtools createrepo_c 2>&1 | tail -5

          # Optional build deps — skip any that aren't available
          dnf install -y --skip-broken --setopt=install_weak_deps=False \
            golang \
            gtk4-devel libadwaita-devel \
            python3-devel desktop-file-utils \
            ImageMagick inkscape librsvg2-tools \
            xcursorgen xorg-x11-apps \
            2>&1 | tail -15 || true

          # Set up rpmbuild tree (don't depend on rpmdev-setuptree succeeding)
          mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          rpmdev-setuptree 2>/dev/null || true
          echo "  ✓ Build environment ready"

      - name: Prepare build-time sources
        run: |
          chmod +x antigravity/ci-prepare-sources.sh
          ./antigravity/ci-prepare-sources.sh

      - name: Build all RPMs
        shell: bash
        run: |
          set -uo pipefail
          echo "⚔ Building Zoro Linux RPMs..."
          BUILT=0
          FAILED=0
          FAILED_PKGS=""

          # RPMs are written DIRECTLY into the workspace collection dir using
          # an absolute _rpmdir + a flat _rpmfilename (no per-arch subdirs).
          # This removes any $HOME/~ expansion ambiguity between build & collect.
          OUT="${GITHUB_WORKSPACE}/built-rpms"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          # Go env for zoro-fetch (needs to fetch modules)
          export GOFLAGS="-mod=mod"
          export GOPROXY="https://proxy.golang.org,direct"
          export GOCACHE="$HOME/.cache/go-build"

          for spec in rpms/*/*.spec; do
            [ -f "$spec" ] || continue
            PKG=$(basename "$spec" .spec)
            SPEC_DIR=$(dirname "$spec")
            echo ""
            echo "──────────────────────────────────────────────"
            echo "  → Building $PKG"

            # Point _sourcedir at the package's own in-repo SOURCES dir so that
            # specs using relative paths (e.g. %{_sourcedir}/../../../shell/..)
            # resolve correctly — this mirrors the Makefile's rpmbuild calls.
            SRCDIR="${PWD}/${SPEC_DIR}/SOURCES"

            # Build — capture the REAL rpmbuild exit code (not a piped tool's).
            # --nodeps: runtime Requires need not be installed to build a noarch pkg.
            LOG=$(mktemp)
            if rpmbuild -bb --nodeps \
                 --define "_topdir $HOME/rpmbuild" \
                 --define "_sourcedir ${SRCDIR}" \
                 --define "_rpmdir ${OUT}" \
                 --define "_rpmfilename %{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}.rpm" \
                 "$spec" > "$LOG" 2>&1; then
              echo "  ✓ $PKG built"
              BUILT=$((BUILT + 1))
            else
              echo "  ✗ $PKG FAILED — last 25 lines:"
              tail -25 "$LOG" | sed 's/^/      /'
              FAILED=$((FAILED + 1))
              FAILED_PKGS="${FAILED_PKGS} ${PKG}"
            fi
            rm -f "$LOG"
          done

          echo ""
          echo "══════════════════════════════════════════════"
          echo "⚔ RPM Build Summary: $BUILT built, $FAILED failed"
          [ -n "$FAILED_PKGS" ] && echo "  Failed packages:${FAILED_PKGS}"
          echo "  RPMs in ${OUT}:"
          ls -la "$OUT" | sed 's/^/    /'
          echo "══════════════════════════════════════════════"

          # Fail the job if NOTHING built, or if any package failed.
          if [ "$BUILT" -eq 0 ]; then
            echo "::error::No RPMs were built — pipeline cannot continue"
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::${FAILED} package(s) failed to build:${FAILED_PKGS}"
            exit 1
          fi

      - name: Collect RPMs
        shell: bash
        run: |
          echo "⚔ Collected RPMs:"
          ls -la "${GITHUB_WORKSPACE}/built-rpms/"
          COUNT=$(find "${GITHUB_WORKSPACE}/built-rpms" -name "*.rpm" | wc -l)
          echo "  Total: ${COUNT} RPM(s)"


      - name: Upload RPMs artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoro-rpms
          path: built-rpms/
          retention-days: 7
          if-no-files-found: error

  # ── Stage 2: Compose Repository ────────────────────────────────
  compose-repo:
    name: "🗂️ Compose Repository"
    needs: build-rpms
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download RPMs
        uses: actions/download-artifact@v4
        with:
          name: zoro-rpms
          path: built-rpms/
        continue-on-error: true

      - name: Install compose tools
        run: |
          dnf install -y dnf-plugins-core 2>&1 | tail -3 || true
          dnf config-manager --set-enabled crb 2>&1 | tail -3 || true
          dnf install -y createrepo_c dnf-utils yum-utils 2>&1 | tail -5 || true

      - name: Create repository structure
        run: |
          echo "⚔ Composing Zoro Linux repository..."
          mkdir -p ${REPO_ROOT}/{BaseOS,AppStream}/{x86_64,aarch64}/{os/Packages,debug,source}

          # Place custom RPMs in AppStream
          if ls built-rpms/*.rpm 1>/dev/null 2>&1; then
            cp built-rpms/*.rpm ${REPO_ROOT}/AppStream/x86_64/os/Packages/
            echo "  ✓ Copied $(ls built-rpms/*.rpm | wc -l) RPMs to AppStream"
          fi

      - name: Download CentOS Stream 10 base packages
        run: |
          echo "⚔ Syncing base packages from CentOS Stream 10..."
          # Sync minimal BaseOS packages for ISO
          dnf install -y dnf-plugins-core 2>/dev/null || true
          dnf config-manager --set-enabled crb 2>/dev/null || true

          # Download core packages needed for minimal install
          dnf download --resolve --destdir=${REPO_ROOT}/BaseOS/x86_64/os/Packages \
            --releasever=10 --repo=baseos \
            basesystem filesystem setup glibc bash coreutils \
            systemd dnf rpm kernel grub2 NetworkManager \
            openssh-server audit firewalld selinux-policy-targeted \
            chrony sudo vim-minimal less passwd \
            2>&1 | tail -20 || true

          # Download GNOME/desktop packages for DVD variant
          dnf download --resolve --destdir=${REPO_ROOT}/AppStream/x86_64/os/Packages \
            --releasever=10 --repo=appstream \
            gnome-shell gnome-terminal nautilus gdm \
            firefox flatpak \
            2>&1 | tail -20 || true

          echo "  ✓ Base packages synced"

      - name: Generate repository metadata
        run: |
          echo "⚔ Generating repodata..."
          for variant in BaseOS AppStream; do
            for arch in x86_64; do
              REPO_PATH="${REPO_ROOT}/${variant}/${arch}/os"
              if [ -d "$REPO_PATH/Packages" ] && ls "$REPO_PATH/Packages/"*.rpm 1>/dev/null 2>&1; then
                createrepo_c --compress-type=zstd "$REPO_PATH"
                echo "  ✓ ${variant}/${arch}: $(ls "$REPO_PATH/Packages/"*.rpm | wc -l) packages"
              else
                # Create empty repo
                mkdir -p "$REPO_PATH/Packages"
                createrepo_c "$REPO_PATH"
                echo "  ⚠ ${variant}/${arch}: empty (placeholder)"
              fi
            done
          done

      - name: Upload composed repo
        uses: actions/upload-artifact@v4
        with:
          name: zoro-repo
          path: /srv/zoro-repos/
          retention-days: 3
          if-no-files-found: warn

  # ── Stage 3: Build ISO ─────────────────────────────────────────
  build-iso:
    name: "💿 Build ISO"
    needs: compose-repo
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream10
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download composed repo
        uses: actions/download-artifact@v4
        with:
          name: zoro-repo
          path: /srv/zoro-repos/
        continue-on-error: true

      - name: Install ISO build tools
        run: |
          echo "⚔ Installing ISO build tools..."
          dnf install -y dnf-plugins-core 2>&1 | tail -3 || true
          dnf config-manager --set-enabled crb 2>&1 | tail -3 || true
          dnf install -y epel-release 2>&1 | tail -3 || \
          dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm 2>&1 | tail -3 || true

          # Core ISO tools
          dnf install -y --skip-broken --setopt=install_weak_deps=False \
            lorax lorax-lmc-novirt \
            xorriso syslinux syslinux-nonlinux \
            grub2-efi-x64 shim-x64 \
            genisoimage isomd5sum \
            squashfs-tools dracut createrepo_c \
            2>&1 | tail -15 || true
          echo "  ✓ ISO tools installed"

      - name: Prepare Boot Templates
        run: |
          echo "⚔ Preparing boot templates for Stage 5..."
          MOD_DIR="${BUILD_ROOT}/iso-modified"
          mkdir -p "${MOD_DIR}"/{images,EFI/BOOT,isolinux}

          # Create GRUB config
          cat > "${MOD_DIR}/EFI/BOOT/grub.cfg" << 'GRUBEOF'
          set default=0
          set timeout=5

          menuentry "Install Zoro Linux 10" --class zorolinux {
            linuxefi /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=ZORO_LINUX_10 inst.ks=hd:LABEL=ZORO_LINUX_10:/ks.cfg quiet
            initrdefi /images/pxeboot/initrd.img
          }
          GRUBEOF

          # Create isolinux config
          cat > "${MOD_DIR}/isolinux/isolinux.cfg" << 'ISOEOF'
          UI vesamenu.c32
          TIMEOUT 50
          DEFAULT install

          LABEL install
            MENU LABEL ^Install Zoro Linux 10
            KERNEL /images/pxeboot/vmlinuz
            APPEND initrd=/images/pxeboot/initrd.img inst.stage2=hd:LABEL=ZORO_LINUX_10 inst.ks=hd:LABEL=ZORO_LINUX_10:/ks.cfg quiet
          ISOEOF

          cp /usr/share/syslinux/isolinux.bin "${MOD_DIR}/isolinux/" 2>/dev/null || true
          cp /usr/share/syslinux/vesamenu.c32 "${MOD_DIR}/isolinux/" 2>/dev/null || true
          cp /usr/share/syslinux/ldlinux.c32 "${MOD_DIR}/isolinux/" 2>/dev/null || true
          cp /usr/share/syslinux/libcom32.c32 "${MOD_DIR}/isolinux/" 2>/dev/null || true
          cp /usr/share/syslinux/libutil.c32 "${MOD_DIR}/isolinux/" 2>/dev/null || true

      - name: Generate boot images with Lorax
        run: |
          echo "⚔ Generating boot images..."
          lorax --product="Zoro Linux" \
                --version="${ZORO_RELEASE}" \
                --release="${ZORO_RELEASE}" \
                --isfinal \
                --volid="ZORO_LINUX_10" \
                --source="file://${REPO_ROOT}/BaseOS/x86_64/os" \
                --source="file://${REPO_ROOT}/AppStream/x86_64/os" \
                --resultdir="${BUILD_ROOT}/lorax-output" \
                2>&1 | tail -30 || true

          MOD_DIR="${BUILD_ROOT}/iso-modified"
          if [ -d "${BUILD_ROOT}/lorax-output/images/pxeboot" ]; then
            cp -r "${BUILD_ROOT}/lorax-output/images/"* "${MOD_DIR}/images/"
            cp -r "${BUILD_ROOT}/lorax-output/EFI" "${MOD_DIR}/" 2>/dev/null || true
          else
            KERNEL=$(ls /boot/vmlinuz-* 2>/dev/null | head -1)
            INITRD=$(ls /boot/initramfs-* 2>/dev/null | head -1)
            if [ -n "$KERNEL" ] && [ -n "$INITRD" ]; then
              mkdir -p "${MOD_DIR}/images/pxeboot"
              cp "$KERNEL" "${MOD_DIR}/images/pxeboot/vmlinuz"
              cp "$INITRD" "${MOD_DIR}/images/pxeboot/initrd.img"
            fi
          fi

      - name: Assemble ISOs using Stage 5
        run: |
          echo "⚔ Assembling ISOs..."
          export ZORO_BUILD_ROOT="${BUILD_ROOT}"
          export ZORO_COMPOSE_DIR="${REPO_ROOT}"
          export ZORO_ISO_DIR="${ISO_ROOT}"
          mkdir -p "${ZORO_ISO_DIR}"
          
          VARIANT="${{ github.event.inputs.variant || 'all-editions' }}"
          sudo -E bash antigravity/stage5-iso-assembly.sh --variant="$VARIANT"

      - name: Generate checksums
        run: |
          cd ${ISO_ROOT}
          for iso in *.iso; do
            [ -f "$iso" ] || continue
            sha256sum "$iso" > "${iso}.sha256"
            echo "  ✓ SHA256: $iso"
          done

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoro-linux-iso
          path: |
            /srv/zoro-isos/10/*.iso
            /srv/zoro-isos/10/*.sha256
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0

  # ── Stage 4: Release Summary ───────────────────────────────────
  release-summary:
    name: "📋 Release Summary"
    needs: build-iso
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download ISO info
        uses: actions/download-artifact@v4
        with:
          name: zoro-linux-iso
          path: iso-output/
        continue-on-error: true

      - name: Print build summary
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "  ⚔  ZORO LINUX 10 — BUILD SUMMARY"
          echo "═══════════════════════════════════════════════════"
          echo ""
          echo "  Version:   ${ZORO_RELEASE} (${ZORO_CODENAME})"
          echo "  Branch:    ${{ github.ref_name }}"
          echo "  Commit:    ${{ github.sha }}"
          echo "  Trigger:   ${{ github.event_name }}"
          echo ""
          if ls iso-output/*.iso 1>/dev/null 2>&1; then
            echo "  📀 ISOs Built:"
            for iso in iso-output/*.iso; do
              SIZE=$(du -h "$iso" | cut -f1)
              echo "    → $(basename $iso) ($SIZE)"
            done
            echo ""
            echo "  ✓ Build SUCCESSFUL"
          else
            echo "  ⚠ No ISO files found in artifacts"
            echo "  Check build-iso job logs for details"
          fi
          echo ""
          echo "═══════════════════════════════════════════════════"
