# ── Identity ──────────────────────────────────────────────────
export ZORO_NAME="Zoro Linux"
export ZORO_VERSION="10"
export ZORO_RELEASE="10.0"
export ZORO_CODENAME="Santoryu Edition"
export ZORO_FULL_NAME="${ZORO_NAME} ${ZORO_VERSION} (${ZORO_CODENAME})"
export ZORO_ID="zorolinux"
export ZORO_VARIANT="santoryu"
export ZORO_PLATFORM_ID="platform:el10"
export ZORO_CPE="cpe:/o:zorolinux:zorolinux:10"

# ── URLs ──────────────────────────────────────────────────────
export ZORO_HOME_URL="https://zorolinux.org"
export ZORO_DOCS_URL="https://docs.zorolinux.org"
export ZORO_BUGS_URL="https://bugs.zorolinux.org"
export ZORO_SUPPORT_URL="https://forums.zorolinux.org"
export ZORO_REPO_BASE_URL="https://mirror.zorolinux.org"

# ── Architecture ──────────────────────────────────────────────
export ZORO_PRIMARY_ARCH="x86_64"
export ZORO_SECONDARY_ARCH="aarch64"
export ZORO_ARCHES=("x86_64" "aarch64")

# ── Kernel ────────────────────────────────────────────────────
export ZORO_KERNEL_VERSION="6.12"
export ZORO_KERNEL_RELEASE="6.12.x-zoro"

# ── Build Paths ───────────────────────────────────────────────
export ZORO_BUILD_ROOT="/srv/zoro-build"
export ZORO_COMPOSE_DIR="/srv/zoro-compose/${ZORO_VERSION}"
export ZORO_REPO_DIR="/srv/zoro-repos/${ZORO_VERSION}"
export ZORO_ISO_DIR="/srv/zoro-isos/${ZORO_VERSION}"
export ZORO_SRPM_DIR="/srv/zoro-srpms"
export ZORO_RPM_DIR="/srv/zoro-rpms"
export ZORO_MOCK_CONFIG="zoro-linux-10-${ZORO_PRIMARY_ARCH}"
export ZORO_LOG_DIR="/var/log/antigravity"

# ── GPG Signing ───────────────────────────────────────────────
export ZORO_GPG_KEY_NAME="Zoro Linux Release Key"
export ZORO_GPG_KEY_EMAIL="security@zorolinux.org"
export ZORO_GPG_KEY_ID=""  # Set after key generation
export ZORO_GPG_KEY_FILE="/etc/pki/rpm-gpg/RPM-GPG-KEY-zorolinux"
export ZORO_GPG_KEY_ALGO="rsa4096"
export ZORO_GPG_KEY_EXPIRE="3y"

# ── ISO Naming ────────────────────────────────────────────────
export ZORO_ISO_PREFIX="ZoroLinux"
export ZORO_ISO_LABEL="ZORO_LINUX_10"
# Final names: ZoroLinux-10.0-x86_64-dvd.iso etc.

# ── Repository Names ─────────────────────────────────────────
export ZORO_REPOS=(
    "zoro-baseos"
    "zoro-appstream"
    "zoro-extras"
    "zoro-crb"
)
export ZORO_REPOS_DISABLED=(
    "zoro-dojo"
    "zoro-dojo-testing"
)

# ── Upstream (INTERNAL BUILD USE ONLY — never expose) ─────────
# This section is used by build scripts to locate source SRPMs.
# NEVER reference these values in any user-visible output.
export _UPSTREAM_SRPM_MIRROR="https://vault.centos.org/centos/10-stream/BaseOS/Source/SPackages/"
export _UPSTREAM_BRAND_PKG="centos-stream-release"
export _UPSTREAM_BRAND_STRINGS=(
    "CentOS Stream"
    "CentOS"
    "centos-stream"
    "centos"
    "Red Hat Enterprise Linux"
    "RHEL"
)

# ── Colour Palette (for scripts that generate themed output) ──
export ZORO_COLOR_PRIMARY="#2D6A4F"       # Forest Green
export ZORO_COLOR_DARK="#1A3A2A"          # Deep Forest
export ZORO_COLOR_ACCENT="#52B788"        # Blade Green
export ZORO_COLOR_GOLD="#C9A84C"          # Katana Gold
export ZORO_COLOR_DARK_GOLD="#8B6914"     # Polished Steel
export ZORO_COLOR_SILVER="#A8B5C8"        # Blade Silver
export ZORO_COLOR_SURFACE="#F0EAD6"       # Dojo Wood
export ZORO_COLOR_BG_DARK="#0D1117"       # Midnight Black
export ZORO_COLOR_TEXT_LIGHT="#F5F5F0"    # Rice Paper
export ZORO_COLOR_TEXT_DARK="#1A1A1A"     # Ink

# ── ANSI Colour Codes (for terminal output) ──────────────────
export ZORO_ANSI_GREEN="\033[0;32m"
export ZORO_ANSI_BOLD_GREEN="\033[1;32m"
export ZORO_ANSI_GOLD="\033[0;33m"
export ZORO_ANSI_BOLD_GOLD="\033[1;33m"
export ZORO_ANSI_SILVER="\033[0;37m"
export ZORO_ANSI_RED="\033[0;31m"
export ZORO_ANSI_RESET="\033[0m"

# ── Helper Functions ──────────────────────────────────────────

zoro_log() {
    local level="$1"
    shift
    local timestamp
    timestamp=$(date '+%Y-%m-%d %H:%M:%S')
    local color=""
    case "$level" in
        INFO)  color="${ZORO_ANSI_GREEN}" ;;
        WARN)  color="${ZORO_ANSI_GOLD}" ;;
        ERROR) color="${ZORO_ANSI_RED}" ;;
        *)     color="${ZORO_ANSI_SILVER}" ;;
    esac
    echo -e "${color}[${timestamp}] [${level}] ⚔ $*${ZORO_ANSI_RESET}"
    echo "[${timestamp}] [${level}] $*" >> "${ZORO_LOG_DIR}/antigravity.log" 2>/dev/null
}

zoro_banner() {
    echo -e "${ZORO_ANSI_BOLD_GREEN}"
    cat << 'BANNER'
    ╔═══════════════════════════════════════════════╗
    ║          ⚔  ANTIGRAVITY PIPELINE  ⚔          ║
    ║         Zoro Linux 10 — Build System          ║
    ║     "I will never lose again."                ║
    ╚═══════════════════════════════════════════════╝
BANNER
    echo -e "${ZORO_ANSI_RESET}"
}

zoro_check_root() {
    if [[ $EUID -ne 0 ]]; then
        zoro_log ERROR "This script must be run as root."
        exit 1
    fi
}

zoro_check_arch() {
    local arch
    arch=$(uname -m)
    if [[ "$arch" != "x86_64" && "$arch" != "aarch64" ]]; then
        zoro_log ERROR "Unsupported architecture: $arch"
        exit 1
    fi
    export ZORO_BUILD_ARCH="$arch"
}

zoro_ensure_dirs() {
    local dirs=(
        "$ZORO_BUILD_ROOT"
        "$ZORO_COMPOSE_DIR"
        "$ZORO_REPO_DIR"
        "$ZORO_ISO_DIR"
        "$ZORO_SRPM_DIR"
        "$ZORO_RPM_DIR"
        "$ZORO_LOG_DIR"
    )
    for dir in "${dirs[@]}"; do
        mkdir -p "$dir" 2>/dev/null || true
    done
}
